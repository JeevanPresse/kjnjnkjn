<!-- Add this section inside your HTML body where you want the browser tool to appear -->
<div id="browser-tool">
    <div class="browser-bar">
        <input type="text" id="url-input" placeholder="Enter a secure URL (e.g., https://example.com)...">
        <button onclick="loadWebpage()">Go</button>
        <button onclick="toggleBrowserFullscreen()">Full Screen</button>
    </div>
    <!-- The iframe serves as the embedded browsing window -->
    <iframe id="site-frame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</div>

<style>
/* CSS Styling for the integrated container */
#browser-tool {
    margin-top: 20px;
    width: 580px;
    background: #222222;
    padding: 15px;
    border-radius: 6px;
    border: 4px solid #3c3c3c;
    box-sizing: border-box;
}
.browser-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}
#url-input {
    flex-grow: 1;
    background: #0a0a0a;
    border: 1px solid #3c3c3c;
    color: #fff;
    padding: 5px 10px;
    font-family: monospace;
}
#browser-tool button {
    background: #ff55ff;
    color: #000;
    border: none;
    padding: 5px 15px;
    cursor: pointer;
    font-weight: bold;
}
#site-frame {
    width: 100%;
    height: 300px;
    border: 2px solid #0a0a0a;
    background: #ffffff;
}
</style>

<script>
// JavaScript Logic for managing the Frame content and Fullscreen states
function loadWebpage() {
    const input = document.getElementById('url-input').value;
    const frame = document.getElementById('site-frame');
    
    // Ensure the input contains a valid protocol schema
    if (input.startsWith('http://') || input.startsWith('https://')) {
        frame.src = input;
    } else {
        frame.src = 'https://' + input;
    }
}

function toggleBrowserFullscreen() {
    const frame = document.getElementById('site-frame');
    
    // Utilize the standard Fullscreen API
    if (!document.fullscreenElement) {
        if (frame.requestFullscreen) {
            frame.requestFullscreen();
        } else if (frame.webkitRequestFullscreen) { /* Safari */
            frame.webkitRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}
</script>
