<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crystal PvP Bind & Inventory Trainer</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 98vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            text-align: center;
            background: #222222;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.7);
            border: 4px solid #3c3c3c;
            position: relative;
            width: 580px;
        }
        h2 { color: #ff55ff; margin: 0 0 10px 0; text-transform: uppercase; font-size: 22px; letter-spacing: 1px; }
        #prompt-box {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            padding: 12px;
            background: #0a0a0a;
            border-radius: 4px;
            border-left: 5px solid #ffaa00;
            min-height: 28px;
        }
        .mc-grid {
            display: grid;
            background: #8f8f8f;
            padding: 4px;
            border-top: 4px solid #fff;
            border-left: 4px solid #fff;
            border-bottom: 4px solid #373737;
            border-right: 4px solid #373737;
            gap: 4px;
            user-select: none;
        }
        #inventory-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #c6c6c6;
            padding: 15px;
            border: 4px solid #3c3c3c;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .inv-title { color: #404040; font-weight: bold; margin-bottom: 8px; font-size: 14px; text-align: left; width: 100%; }
        #main-inventory { grid-template-columns: repeat(9, 1fr); margin-bottom: 15px; }
        #hud-row {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }
        #hotbar { grid-template-columns: repeat(9, 1fr); }
        .slot {
            width: 48px;
            height: 48px;
            background: #8b8b8b;
            border-top: 3px solid #373737;
            border-left: 3px solid #373737;
            border-bottom: 3px solid #fff;
            border-right: 3px solid #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .slot:hover { background: #9c9c9c; }
        .active-slot {
            border: 3px solid #ffffff !important;
            background: #afafaf;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }
        .slot-bind {
            position: absolute;
            top: 2px;
            left: 4px;
            color: #dddddd;
            font-size: 10px;
            font-family: sans-serif;
            text-shadow: 1px 1px 1px #000;
        }
        .slot-item {
            font-size: 10px;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px #000;
            word-break: break-word;
            line-height: 11px;
            padding: 0 2px;
            pointer-events: none;
        }
        #offhand-container { display: flex; flex-direction: column; align-items: center; }
        #stats { margin-top: 20px; font-size: 15px; color: #aaa; }
        .score { color: #55ff55; font-weight: bold; }
        .hint { font-size: 12px; color: #777; margin-top: 5px; }

        /* Lock Interface Start Overlay */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 6px;
        }
        #start-btn {
            background: #55ff55;
            color: #111;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(85,255,85,0.4);
        }
        #start-btn:hover { background: #33cc33; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Click activation wall to bypass browser hardware restrictions -->
    <div id="start-overlay">
        <h3 style="color: #ffaa00; margin-bottom: 20px;">CRYSTAL PVP TRAINER</h3>
        <button id="start-btn" onclick="startGame()">START PRACTICE</button>
    </div>

    <h2>Crystal PvP Practice</h2>
    <div id="prompt-box">SWITCH TO: <span id="target-item" style="color: #ff55ff;">NETHERITE SWORD</span></div>
    
    <div id="hud-row">
        <div id="hotbar" class="mc-grid">
            <div class="slot active-slot" id="s1" data-slot="1"><span class="slot-bind">CAPS</span><span class="slot-item">Sword</span></div>
            <div class="slot" id="s2" data-slot="2"><span class="slot-bind">2</span><span class="slot-item">Pearls</span></div>
            <div class="slot" id="s3" data-slot="3"><span class="slot-bind">3</span><span class="slot-item">Glowstone</span></div>
            <div class="slot" id="s4" data-slot="4"><span class="slot-bind">4</span><span class="slot-item">Gapples</span></div>
            <div class="slot" id="s5" data-slot="5"><span class="slot-bind">R</span><span class="slot-item">Anchors</span></div>
            <div class="slot" id="s6" data-slot="6"><span class="slot-bind">ALT</span><span class="slot-item">Totem</span></div>
            <div class="slot" id="s7" data-slot="7"><span class="slot-bind">X</span><span class="slot-item">Obsidian</span></div>
            <div class="slot" id="s8" data-slot="8"><span class="slot-bind">C</span><span class="slot-item">Crystals</span></div>
            <div class="slot" id="s9" data-slot="9"><span class="slot-bind">V</span><span class="slot-item">Pickaxe</span></div>
        </div>

        <div id="offhand-container">
            <span style="font-size: 10px; color:#888; margin-bottom:2px;">OFFHAND</span>
            <div class="slot" id="hud-offhand" style="border: 3px solid #ff5555;"><span class="slot-bind">Q</span><span class="slot-item">Empty</span></div>
        </div>
    </div>

    <div id="inventory-screen">
        <div class="inv-title">Inventory (Press E to Close)</div>
        <div id="main-inventory" class="mc-grid"></div>
        <div class="inv-title">Hotbar</div>
        <div id="inv-hotbar-mirror" class="mc-grid" style="grid-template-columns: repeat(9, 1fr);"></div>
    </div>

    <div id="stats">Score: <span id="score-val" class="score">0</span> | Streak: <span id="streak-val" class="score">0</span></div>
    <div class="hint">Press [E] to toggle inventory. Drag items to rearrange them!</div>
</div>

<script>
    const hotbarConfig = {
        'CapsLock':  { id: 's1', name: 'NETHERITE SWORD', defaultItem: 'Sword' },
        'Digit2':    { id: 's2', name: 'ENDER PEARLS', defaultItem: 'Pearls' },
        'Digit3':    { id: 's3', name: 'GLOWSTONE', defaultItem: 'Glowstone' },
        'Digit4':    { id: 's4', name: 'GOLDEN APPLES', defaultItem: 'Gapples' },
        'KeyR':      { id: 's5', name: 'RESPAWN ANCHORS', defaultItem: 'Anchors' },
        'AltLeft':   { id: 's6', name: 'TOTEM', defaultItem: 'Totem' },
        'AltRight':  { id: 's6', name: 'TOTEM', defaultItem: 'Totem' },
        'KeyX':      { id: 's7', name: 'OBSIDIAN', defaultItem: 'Obsidian' },
        'KeyC':      { id: 's8', name: 'CRYSTALS', defaultItem: 'Crystals' },
        'KeyV':      { id: 's9', name: 'PICKAXE', defaultItem: 'Pickaxe' }
    };

    let offhandItem = "Empty";
    let score = 0;
    let streak = 0;
    let isInventoryOpen = false;
    let currentTarget = null;
    let draggedElement = null;

    const mainInv = document.getElementById('main-inventory');
    const mirrorHotbar = document.getElementById('inv-hotbar-mirror');
    const extraItems = ['Crystals', 'Anchors', 'Glowstone', 'Totem', 'Obsidian', 'Potions', 'Sword', 'Pearls', 'Gapples'];
    
    for (let i = 0; i < 27; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.setAttribute('draggable', 'true');
        slot.dataset.type = 'storage';
        slot.dataset.index = i;
        slot.innerHTML = `<span class="slot-item">${i < extraItems.length ? extraItems[i] : 'Empty'}</span>`;
        mainInv.appendChild(slot);
    }

    Object.keys(hotbarConfig).forEach((code) => {
        if(code === 'AltRight') return;
        const conf = hotbarConfig[code];
        const mirrorSlot = document.createElement('div');
        mirrorSlot.className = 'slot';
        mirrorSlot.setAttribute('draggable', 'true');
        mirrorSlot.dataset.type = 'hotbar';
        mirrorSlot.dataset.key = code;
        mirrorSlot.innerHTML = `<span class="slot-bind">${conf.id.replace('s','')}</span><span class="slot-item">${conf.defaultItem}</span>`;
        mirrorHotbar.appendChild(mirrorSlot);
    });

    const pvpPool = ['NETHERITE SWORD', 'ENDER PEARLS', 'GLOWSTONE', 'GOLDEN APPLES', 'RESPAWN ANCHORS', 'TOTEM', 'OBSIDIAN', 'CRYSTALS', 'PICKAXE', 'OFFHAND TOTEM'];
    
    function nextPrompt() {
        let next;
        do {
            next = pvpPool[Math.floor(Math.random() * pvpPool.length)];
        } while (next === currentTarget);
